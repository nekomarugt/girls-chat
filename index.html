<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>おしゃべりフレンズ</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌸%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#ffb8d6"><link rel="stylesheet" href="style.css"></head><body>
<div class="app" id="app">
<section id="sel"><h1>おしゃべりフレンズ</h1><p class="sub">だれとお話する？</p><div id="cards"></div>
<button class="gear big" data-open>⚙️ 設定</button></section>
<section id="chat" hidden><header><button id="back" title="キャラ選択へ">‹</button><div class="av" id="hav"></div><div class="info"><div class="name" id="hname"></div><div class="st" id="hst">オンライン</div></div><button class="gear" data-open title="設定">⚙️</button><button id="reset">リセット</button></header>
<main id="log"></main><form id="f"><input id="in" placeholder="メッセージを入力…" autocomplete="off"><button>送信</button></form></section>
</div>
<div id="dlg" hidden><div class="panel"><h2>⚙️ 設定</h2>
<label>会話の深さ<select id="dp"><option value="short">あっさり（短め）</option><option value="normal">ふつう</option><option value="deep">がっつり（長め・質問多め）</option></select></label>
<label class="tg"><input type="checkbox" id="aion"> AIモード（ブラウザ内・無料）</label>
<label>モデル<select id="am"><option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B（おすすめ・約1GB・キャラがぶれにくい）</option><option value="Qwen2.5-3B-Instruct-q4f16_1-MLC">Qwen2.5 3B（最高品質・約2GB・重い／遅い）</option><option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B（軽量・約400MB・キャラが崩れやすい）</option></select></label>
<p class="note">AIはこのブラウザの中だけで動きます（APIキー不要・無料・会話は外部に送られません）。初回だけモデル（3Bは約2GB、1.5Bは約1GB、0.5Bは約400MB）をダウンロードするので<b>Wi-Fi推奨</b>。、次回からはキャッシュされます。WebGPU対応ブラウザ（Chrome / Edge 最新版）が必要です。1.5Bのほうがキャラをしっかり守れるので、動く端末ならおすすめ。あいさつや自己紹介などはルール返信を使い、変な返事はいつもの返事に差し替えます。オフのときはいつものルール返信だよ。</p>
<div id="prog" hidden><div class="bar"><i id="pbar"></i></div><div id="ptxt" class="note"></div></div>
<div class="btns"><button id="ssave">保存</button><button id="sclose" class="sub2">閉じる</button></div></div></div>
<script src="characters.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
